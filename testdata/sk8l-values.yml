service:
  type: NodePort
  labels:
    app: "sk8l"
  ports:
    - name: http
      port: 8590
      targetPort: http
      protocol: TCP
      nodePort: 30958
# Enables network policy for sk8l pods
networkPolicy:
  enabled: false
  apiserverPolicy:
    ingress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/8
    egress:
      - to:
          - ipBlock:
              cidr: 0.0.0.0/8
