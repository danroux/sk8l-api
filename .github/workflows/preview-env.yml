name: Preview Environment

on:
  pull_request_target:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: read

jobs:
  preview:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Comment deploying status on PR
        if: github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- sk8l-preview -->"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          {
            echo "${MARKER}"
            echo "⏳ **Preview environment deploying...**"
            echo ""
            echo "- **Workflow Run**: [${{ github.run_id }}](${RUN_URL})"
            if [ -n "$HEAD_SHA" ]; then
              echo "- **API Commit**: [\`${HEAD_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${HEAD_SHA})"
            fi
            echo "- **Updated**: ${TIMESTAMP}"
          } > /tmp/preview-comment.md

          COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUM}/comments?per_page=100" \
            --jq ".[] | select((.body // \"\") | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUM}/comments" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
          fi

      - name: Wait for preview image in ghcr.io
        if: github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        timeout-minutes: 10
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          IMAGE="ghcr.io/danroux/sk8l-api:dev-${PR_NUM}"
          echo "Waiting for ${IMAGE} to be available in ghcr.io..."

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          found=false
          for i in $(seq 1 40); do
            if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "✅ Image ${IMAGE} is available in ghcr.io!"
              found=true
              break
            fi
            echo "Attempt $i/40: Image not ready yet in ghcr.io. Waiting 15s..."
            sleep 15
          done

          if [ "$found" != "true" ]; then
            echo "❌ Timed out waiting for ${IMAGE} to be published."
            exit 1
          fi

      - name: Checkout sk8l-config
        uses: actions/checkout@v7
        with:
          repository: danroux/sk8l-config
          token: ${{ secrets.CONFIG_REPO_PAT }}
          ref: master

      - name: Deploy Preview Manifest and comment on PR
        if: github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          APP_NAME="sk8l-api-pr-${PR_NUM}"
          NAMESPACE="sk8l-api-pr-${PR_NUM}"
          FILE="apps/previews/api-pr-${PR_NUM}.yaml"

          CHART_VERSION=$(yq '.spec.sources[0].targetRevision' apps/sk8l.yaml)

          mkdir -p apps/previews

          sed -e "s|APP_NAME_PLACEHOLDER|${APP_NAME}|g" \
              -e "s|NAMESPACE_PLACEHOLDER|${NAMESPACE}|g" \
              -e "s|CHART_VERSION_PLACEHOLDER|${CHART_VERSION}|g" \
              -e "s|API_IMAGE_PLACEHOLDER|ghcr.io/danroux/sk8l-api|g" \
              -e "s|API_TAG_PLACEHOLDER|dev-${PR_NUM}|g" \
              manifests/preview-template/application.yaml > "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if ! git diff --staged --quiet; then
            git commit -m "preview: deploy sk8l-api PR #${PR_NUM}"
            git pull --rebase origin master
            git push origin master
          fi

          CONFIG_SHA=$(git log -n 1 --format=%H -- "$FILE")
          CONFIG_SHORT="${CONFIG_SHA:0:7}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          MARKER="<!-- sk8l-preview -->"

          {
            echo "${MARKER}"
            echo "🚀 **Preview environment deployed!**"
            echo ""
            echo "- **Workflow Run**: [${{ github.run_id }}](${RUN_URL})"
            if [ -n "$HEAD_SHA" ]; then
              echo "- **API Commit**: [\`${HEAD_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${HEAD_SHA})"
            fi
            echo "- **Config Commit**: [\`${CONFIG_SHORT}\`](https://github.com/danroux/sk8l-config/commit/${CONFIG_SHA}) ([\`${FILE}\`](https://github.com/danroux/sk8l-config/blob/${CONFIG_SHA}/${FILE}))"
            echo "- **Namespace**: \`${NAMESPACE}\`"
            echo "- **ArgoCD App**: \`${APP_NAME}\`"
            echo "- **Chart Version**: \`${CHART_VERSION}\`"
            echo "- **Image (PR)**: \`ghcr.io/danroux/sk8l-api:dev-${PR_NUM}\`"
            echo "- **Updated**: ${TIMESTAMP}"
            echo ""
            echo '```bash'
            echo "while ! kubectl -n ${NAMESPACE} get deployment sk8l-api &>/dev/null; do sleep 3; done && \\"
            echo "kubectl -n ${NAMESPACE} rollout status deployment/sk8l-api --timeout=300s && \\"
            echo "kubectl -n ${NAMESPACE} port-forward svc/sk8l 8001:8590"
            echo '```'
            echo "UI: https://localhost:8001"
          } > /tmp/preview-comment.md

          COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUM}/comments?per_page=100" \
            --jq ".[] | select((.body // \"\") | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$(cat /tmp/preview-comment.md)" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUM}/comments" -f body="$(cat /tmp/preview-comment.md)" >/dev/null
          fi

      - name: Teardown Preview Manifest
        if: |
          (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
          (github.event.action == 'closed')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          NAMESPACE="sk8l-api-pr-${PR_NUM}"
          FILE="apps/previews/api-pr-${PR_NUM}.yaml"

          if [ -f "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm "$FILE"
            git commit -m "preview: teardown sk8l-api PR #${PR_NUM}"
            git pull --rebase origin master
            git push origin master

            MARKER="<!-- sk8l-preview -->"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            {
              echo "${MARKER}"
              echo "🧹 **Preview environment destroyed.**"
              echo ""
              echo "- **Namespace**: \`${NAMESPACE}\`"
              echo "- **Updated**: ${TIMESTAMP}"
            } > /tmp/preview-comment.md

            COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUM}/comments?per_page=100" \
              --jq ".[] | select((.body // \"\") | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
            else
              gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUM}/comments" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
            fi
          fi

      - name: Comment failure status on PR
        if: failure() && github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- sk8l-preview -->"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          {
            echo "${MARKER}"
            echo "❌ **Preview deployment failed.**"
            echo ""
            echo "- **Workflow Run**: [${{ github.run_id }}](${RUN_URL})"
            if [ -n "$HEAD_SHA" ]; then
              echo "- **API Commit**: [\`${HEAD_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${HEAD_SHA})"
            fi
            echo "- **Updated**: ${TIMESTAMP}"
          } > /tmp/preview-comment.md

          COMMENT_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUM}/comments?per_page=100" \
            --jq ".[] | select((.body // \"\") | contains(\"${MARKER}\")) | .id" | head -n 1 || true)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUM}/comments" -f body="$(cat /tmp/preview-comment.md)" >/dev/null || true
          fi
