name: Preview Environment

on:
  pull_request_target:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  preview:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for preview image in ghcr.io
        if: github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        timeout-minutes: 10
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          IMAGE="ghcr.io/danroux/sk8l-api:dev-${PR_NUM}"
          echo "Waiting for ${IMAGE} to be available in ghcr.io..."

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          found=false
          for i in $(seq 1 40); do
            if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "✅ Image ${IMAGE} is available in ghcr.io!"
              found=true
              break
            fi
            echo "Attempt $i/40: Image not ready yet in ghcr.io. Waiting 15s..."
            sleep 15
          done

          if [ "$found" != "true" ]; then
            echo "❌ Timed out waiting for ${IMAGE} to be published."
            exit 1
          fi

      - name: Checkout sk8l-config
        uses: actions/checkout@v7
        with:
          repository: danroux/sk8l-config
          token: ${{ secrets.CONFIG_REPO_PAT }}
          ref: master

      - name: Deploy Preview Manifest
        if: github.event.action == 'labeled' && github.event.label.name == 'deploy-preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          APP_NAME="sk8l-api-pr-${PR_NUM}"
          NAMESPACE="sk8l-api-pr-${PR_NUM}"
          FILE="apps/previews/api-pr-${PR_NUM}.yaml"

          CHART_VERSION=$(yq '.spec.sources[0].targetRevision' apps/sk8l.yaml)

          mkdir -p apps/previews

          sed -e "s|APP_NAME_PLACEHOLDER|${APP_NAME}|g" \
              -e "s|NAMESPACE_PLACEHOLDER|${NAMESPACE}|g" \
              -e "s|CHART_VERSION_PLACEHOLDER|${CHART_VERSION}|g" \
              -e "s|API_IMAGE_PLACEHOLDER|ghcr.io/danroux/sk8l-api|g" \
              -e "s|API_TAG_PLACEHOLDER|dev-${PR_NUM}|g" \
              manifests/preview-template/application.yaml > "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if ! git diff --staged --quiet; then
            git commit -m "preview: deploy sk8l-api PR #${PR_NUM}"
            git pull --rebase origin master
            git push origin master

            if [ "${{ github.event.action }}" = "labeled" ]; then
              COMMENT_BODY=$(printf "🚀 **Preview environment deployed!**\n\n- **Namespace**: \`%s\`\n- **ArgoCD App**: \`%s\`\n- **Chart Version**: \`%s\`\n- **Image (PR)**: \`ghcr.io/danroux/sk8l-api:dev-%s\`\n\n\`\`\`bash\nwhile ! kubectl -n %s get deployment sk8l-api &>/dev/null; do sleep 3; done && \\\\\nkubectl -n %s rollout status deployment/sk8l-api --timeout=300s && \\\\\nkubectl -n %s port-forward svc/sk8l 8001:8590\n\`\`\`\nUI: https://localhost:8001" \
                "${NAMESPACE}" "${APP_NAME}" "${CHART_VERSION}" "${PR_NUM}" "${NAMESPACE}" "${NAMESPACE}" "${NAMESPACE}")
              gh pr comment "${PR_NUM}" --repo "${{ github.repository }}" --body "${COMMENT_BODY}" || true
            fi
          fi

      - name: Teardown Preview Manifest
        if: |
          (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
          (github.event.action == 'closed')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          NAMESPACE="sk8l-api-pr-${PR_NUM}"
          FILE="apps/previews/api-pr-${PR_NUM}.yaml"

          if [ -f "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm "$FILE"
            git commit -m "preview: teardown sk8l-api PR #${PR_NUM}"
            git pull --rebase origin master
            git push origin master

            gh pr comment "${PR_NUM}" --repo "${{ github.repository }}" --body "🧹 **Preview environment destroyed.** Namespace \`${NAMESPACE}\` ha sido eliminado." || true
          fi
