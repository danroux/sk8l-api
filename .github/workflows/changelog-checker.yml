# This workflow checks that there is either a 'pr/no-changelog' label applied to a PR
# or there is a .changelog/<pr number>.txt file associated with a PR for a changelog entry
name: Changelog Entry

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]
    # Runs on PRs to main and all release branches
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Auto-generate Dependabot changelog
        if: github.actor == 'dependabot[bot]'
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          FILE=".changelog/${PR_NUM}.txt"

          if [ ! -f "$FILE" ]; then
            mkdir -p .changelog
            FIRST_COMMIT=$(git log -10 --pretty=format:%H origin/main..HEAD | tail -1)
            FIRST_COMMIT_BODY=$(git log -1 --pretty=format:%B "$FIRST_COMMIT")

            printf '```release-note:dependency\nci/dependabot: %s\n\n%s\n```\n' \
              "${{ github.event.pull_request.title }}" \
              "$FIRST_COMMIT_BODY" > "$FILE"

            git config user.name "dependabot[bot]"
            git config user.email "dependabot[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Add .changelog/${PR_NUM}.txt"
            git push
          fi

      - name: Validate changelog
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          FILE=".changelog/${PR_NUM}.txt"

          if echo "${{ toJson(github.event.pull_request.labels.*.name) }}" | grep -q '"pr/no-changelog"'; then
            echo "Skipping: 'pr/no-changelog' label is present."
            exit 0
          fi

          if [ -f "$FILE" ]; then
            echo "Found changelog entry: $FILE"
            exit 0
          fi

          echo "::error::Missing changelog entry ($FILE) and 'pr/no-changelog' label not set."
          exit 1
