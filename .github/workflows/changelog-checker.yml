# This workflow checks that there is either a 'pr/no-changelog' label applied to a PR
# or there is a .changelog/<pr number>.txt file associated with a PR for a changelog entry
name: Changelog Entry

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]
    # Runs on PRs to main and all release branches
    branches:
      - main

permissions:
  pull-requests: read
  contents: read

jobs:
  changelog:
    if: |
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'pr/no-changelog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate changelog
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          FILE=".changelog/${PR_NUM}.txt"

          if [ -f "$FILE" ]; then
            echo "Found changelog entry: $FILE"
            exit 0
          fi

          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "Skipping: Dependabot PR changelog entry will be generated during prepare-release."
            exit 0
          fi

          if [[ "${{ github.event.pull_request.head.ref }}" =~ ^release- ]] || [ "${{ contains(github.event.pull_request.labels.*.name, 'pr/no-changelog') }}" = "true" ]; then
            echo "Skipping: release branch or 'pr/no-changelog' label is present."
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          if [ -n "$CHANGED_FILES" ] && ! echo "$CHANGED_FILES" | grep -qvE '^(\.github/|ci/|\.devcontainer/|\.agents/|\.golangci\.yml$)'; then
            echo "Skipping: PR only modifies CI/internal configuration files."
            exit 0
          fi

          echo "::error::Missing changelog entry ($FILE) and 'pr/no-changelog' label not set."
          exit 1
