name: k8s-rwkld

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      image_tag:
        required: true
        type: string
      kind_version:
        required: true
        type: string
      k8s_version:
        required: true
        type: string
      k8s_image:
        required: true
        type: string

jobs:
  k8s-tests:
    runs-on: ubuntu-latest
    env:
      GRPCURL_VERSION: 1.9.3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
      # - name: Set up Go ${{ env.GO_VERSION }}
      #   uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
      #   with:
      #     go-version: ${{ env.GO_VERSION }}
      #     check-latest: false
      #     cache: false
      #   id: go
      - name: Update config files with dev image tag
        if:
        run: |
          make update-config-files GITHUB_PR_IMAGE_TAG=dev-${{ inputs.image_tag }}
      - name: Setup Kubernetes cluster ${{ inputs.kind_version }}/${{ inputs.k8s_version }}
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: "sk8l-${{ inputs.kind_version }}-${{ inputs.k8s_version }}-${{ inputs.image_tag }}"
          version: ${{ inputs.kind_version }}
          node_image: ${{ inputs.k8s_image }}
          config: testdata/sk8l-kind.yml
      - name: Test connection
        run: |
          kubectl cluster-info > /dev/null
          kubectl describe node > /dev/null
      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: 'v3.13.3'
      - name: Setup certs
        run: |
          make setup-certs > /dev/null
      - name: Fetch sk8l-api:dev-${{ inputs.image_tag }}
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./sk8l-api:dev-${{ inputs.image_tag }}.tar
          key: dev-${{ inputs.image_tag }}-${{ github.sha }}
      - name: Load sk8l-api:dev-${{ inputs.image_tag }}
        run:
          kind load image-archive sk8l-api:dev-${{ inputs.image_tag }}.tar -n sk8l-${{ inputs.kind_version }}-${{ inputs.k8s_version }}-${{ inputs.image_tag }}
      - name: Install Chart
        run: |
          make install-chart-ci > /dev/null
      - name: /metrics smoke tests
        id: metrics_smoke_tests
        run: |
          make metrics-smoke-tests
      - name: /metrics smoke tests error output
        if: ${{ failure() && steps.metrics_smoke_tests.conclusion == 'failure' }}
        run: |
          echo "=== PODS ==="
          kubectl get pods -n sk8l
          echo "=== CRONJOBS ==="
          kubectl get cronjobs -n sk8l
          echo "=== SK8L-API POD LOGS ==="
          kubectl logs -n sk8l -l app.kubernetes.io/pod=sk8l-api --all-containers=true --tail=100 || true
          echo "=== CURRENT STATE (METRICS) ==="
          cat current_state.txt || true
          echo "=== EXPECTED OUTPUT ==="
          cat expected_output.txt || true
          echo "=== JOB OUTPUT ==="
          cat job_output.txt || true
          exit 1
      - name: Fetch grpcurl
        id: grpcurl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/grpcurl
          key: grpcurl-${{ env.GRPCURL_VERSION }}-linux-x86_64
      - name: Install grpcurl
        if: steps.grpcurl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL "https://github.com/fullstorydev/grpcurl/releases/download/v${{ env.GRPCURL_VERSION }}/grpcurl_${{ env.GRPCURL_VERSION }}_linux_x86_64.tar.gz" | tar -xz -C ~/.local/bin grpcurl
          chmod +x ~/.local/bin/grpcurl
      - name: smoke tests
        id: api_smoke_tests
        run: |
          make api-smoke-tests
      - name: api smoke tests error output
        if: ${{ failure() && steps.api_smoke_tests.conclusion == 'failure' }}
        run: |
          echo "=== SK8L-API POD LOGS ==="
          kubectl logs -n sk8l -l app.kubernetes.io/pod=sk8l-api --all-containers=true --tail=100 || true
          echo "=== CRONJOBS.JSON ==="
          cat cronjobs.json || true
          echo "=== JOBS.JSON ==="
          cat jobs.json || true
          exit 1
