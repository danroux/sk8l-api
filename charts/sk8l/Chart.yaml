apiVersion: v2
name: sk8l
version: 0.30.0
appVersion: 0.29.0
description: |
  sk8l is a Cronjob/Job monitoring and visualization tool in Kubernetes. It enables users to monitor Cronjob/Job status by collecting metrics from the configured targets and publish them to prometheus.
icon: https://sk8l.io/charts/logo.png
keywords:
  - Cronjob
  - Monitoring
  - Observability
  - Metrics
  - Prometheus
home: https://sk8l.io
type: application
kubeVersion: ">=1.29.0-0"
sources:
  - "https://github.com/danroux/sk8l-api"
  - "https://github.com/danroux/sk8l-ui"
maintainers:
  - name: danroux
    email: dan@sk8l.io
    url: https://sk8l.io
annotations:
  artifacthub.io/images: |
    - name: sk8l-api
      image: danroux/sk8l-api:v0.26.0
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "go: Remove the no-op tls.caSecretName / TLS_CA_FILE client CA support"
    - kind: changed
      description: "helm: Default service.type is now ClusterIP instead of LoadBalancer; set service.type=LoadBalancer explicitly to keep external exposure"
    - kind: security
      description: "api: Disable CORS by default; allow cross-origin callers only through exact origins in SK8L_CORS_ALLOWED_ORIGINS (chart: sk8lApi.corsAllowedOrigins) instead of reflecting any Origin"
    - kind: security
      description: "api: Limit Connect request messages to 64 KiB and request headers to 64 KiB, and recover from handler panics with an Internal status"
    - kind: changed
      description: "api: Expose pod_spec (PodSpecResponse) on CronjobResponse so container resources and scheduling constraints are available on CronJob views"
    - kind: changed
      description: "ci: Pin protobuf codegen tool versions and add CI proto-drift verification"
    - kind: changed
      description: "go: Detect informer watch errors to degrade /readyz and recover automatically on Kubernetes API Server reconnection"
    - kind: changed
      description: "api: Regenerate protobuf/Connect stubs and remove legacy gRPC server implementation from Sk8lServer"
    - kind: fixed
      description: "api: Map Kubernetes errors to canonical ConnectRPC status codes and reject un-synced requests during startup API server outages"
    - kind: fixed
      description: "go: Cancel active request contexts via BaseContext before HTTP shutdown so open streams exit immediately"
    - kind: fixed
      description: "go: Include Pending and Unschedulable Job Pods with nil Status.StartTime in Store.FindJobPodsForJob responses"
    - kind: fixed
      description: "go: Replace non-atomic GaugeVec resets with atomic Prometheus metric snapshots, suppress pre-sync zeroes, and debounce metrics refreshes on informer bursts"
    - kind: fixed
      description: "go: mark CronJob active when running jobs exist without status.active"
    - kind: changed
      description: "ci/dependabot: docker:(deps): bump alpine from 3.24.3 to 3.24.4"
    - kind: changed
      description: "ui: Regenerate Connect TypeScript protobuf stubs and display CronJob container resources and nodeSelector in the Overview sidebar"
    - kind: fixed
      description: "ui: Guard unscheduled Pods with empty containerStatuses and surface Unschedulable status and messages on Pod, Job, and CronJob rows, Overview, ProgressBar, and JobCounter"
    - kind: changed
      description: "ui/ci/dependabot: docker:(deps): bump cypress/included from 16.2.1 to 16.3.0"
    - kind: changed
      description: "ui/ci/dependabot: npm:(deps): bump shiki from 4.5.0 to 4.6.0"
    - kind: changed
      description: "ui/ci/dependabot: npm:(deps): bump vue-router from 5.4.0 to 5.5.0"
    - kind: changed
      description: "ui/ci/dependabot: npm:(deps-dev): bump eslint from 10.13.0 to 10.14.0"
    - kind: changed
      description: "ui/ci/dependabot: npm:(deps-dev): bump eslint-plugin-vue from 10.9.0 to 10.12.1"
    - kind: changed
      description: "ui/ci/dependabot: npm:(deps-dev): bump eslint-plugin-vuejs-accessibility from 2.5.0 to 2.6.3"
    - kind: changed
      description: "ui/ci/dependabot: npm:(deps-dev): bump vue-eslint-parser from 10.4.0 to 10.4.2"
