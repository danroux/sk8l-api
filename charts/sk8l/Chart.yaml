apiVersion: v2
name: sk8l
version: 0.26.0
appVersion: 0.25.0
description: |
  sk8l is a Cronjob/Job monitoring and visualization tool in Kubernetes. It enables users to monitor Cronjob/Job status by collecting metrics from the configured targets and publish them to prometheus.
icon: https://sk8l.io/charts/logo.png
keywords:
  - Cronjob
  - Monitoring
  - Observability
  - Metrics
  - Prometheus
home: https://sk8l.io
type: application
kubeVersion: ">=1.29.0-0"
sources:
  - "https://github.com/danroux/sk8l-api"
  - "https://github.com/danroux/sk8l-ui"
maintainers:
  - name: danroux
    email: dan@sk8l.io
    url: https://sk8l.io
annotations:
  artifacthub.io/images: |
    - name: sk8l-api
      image: danroux/sk8l-api:v0.22.0
    - name: sk8l-ui
      image: danroux/sk8l-ui:v0.19.0
    - name: envoy
      image: envoyproxy/envoy:v1.30-latest
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "go: Implement client-go informers store with indexed lookups, SetTransform memory stripping, and coalesced change notifications"
    - kind: changed
      description: "go: Switch storage backend from Badger to in-memory client-go informers and remove legacy collectors"
    - kind: changed
      description: "helm: Add RBAC clusterWide toggle, default to namespaced Role/RoleBinding, and dynamic namespace resolution"
    - kind: changed
      description: "docker: Optimize BuildKit cache mounts and exclude metadata from build context"
    - kind: changed
      description: "go: Abstract store operations behind Store interface and decouple gRPC streaming from Badger pub/sub"
    - kind: changed
      description: "go: Remove Badger dependency, unused logger adapter and chart storage volume; enforce `mnd` linter on all files"
    - kind: changed
      description: "ci/dependabot: docker:(deps): bump alpine from 3.24.2 to 3.24.3"
