apiVersion: v2
name: sk8l
version: 0.29.0
appVersion: 0.28.0
description: |
  sk8l is a Cronjob/Job monitoring and visualization tool in Kubernetes. It enables users to monitor Cronjob/Job status by collecting metrics from the configured targets and publish them to prometheus.
icon: https://sk8l.io/charts/logo.png
keywords:
  - Cronjob
  - Monitoring
  - Observability
  - Metrics
  - Prometheus
home: https://sk8l.io
type: application
kubeVersion: ">=1.29.0-0"
sources:
  - "https://github.com/danroux/sk8l-api"
  - "https://github.com/danroux/sk8l-ui"
maintainers:
  - name: danroux
    email: dan@sk8l.io
    url: https://sk8l.io
annotations:
  artifacthub.io/images: |
    - name: sk8l-api
      image: danroux/sk8l-api:v0.25.0
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "helm: Default tls.enabled to false so sk8l installs out of the box without cert-manager or pre-existing TLS secrets"
    - kind: changed
      description: "helm: Remove separate UI/Envoy deployment, service, and legacy gRPC/health ports (8585, 8588, 8001, 9080) in favor of unified port 8590"
    - kind: changed
      description: "go: Embed sk8l-ui static assets via go:embed and serve SPA, Connect/gRPC-Web/gRPC RPCs, metrics, and health probes from a single server on port 8590"
    - kind: changed
      description: "go: Support optional TLS (TLS_ENABLED) and unencrypted HTTP/2 (h2c) alongside HTTP/1.1 on port 8590, with configurable tls.secretName and optional tls.caSecretName in Helm"
