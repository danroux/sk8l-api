apiVersion: v2
name: sk8l
version: 0.25.0
appVersion: 0.24.0
description: |
  sk8l is a Cronjob/Job monitoring and visualization tool in Kubernetes. It enables users to monitor Cronjob/Job status by collecting metrics from the configured targets and publish them to prometheus.
icon: https://sk8l.io/charts/logo.png
keywords:
  - Cronjob
  - Monitoring
  - Observability
  - Metrics
  - Prometheus
home: https://sk8l.io
type: application
kubeVersion: ">=1.29.0-0"
sources:
  - "https://github.com/danroux/sk8l-api"
  - "https://github.com/danroux/sk8l-ui"
maintainers:
  - name: danroux
    email: dan@sk8l.io
    url: https://sk8l.io
annotations:
  artifacthub.io/images: |
    - name: sk8l-api
      image: danroux/sk8l-api:v0.21.0
    - name: sk8l-ui
      image: danroux/sk8l-ui:v0.19.0
    - name: envoy
      image: envoyproxy/envoy:v1.30-latest
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "go: Standardize Prometheus metrics to OpenMetrics format with static metric names and dimensional labels, replacing legacy dynamic metric names"
    - kind: changed
      description: "helm: Auto-provision Grafana overview dashboard via ConfigMap with discovery labels"
    - kind: changed
      description: "go: embed Grafana dashboard JSON and remove legacy template generator"
    - kind: changed
      description: "ci/dependabot: docker:(deps): bump golang from 1.27.1 to 1.27.2"
