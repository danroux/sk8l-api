{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sk8l.serviceAccountName" . }}
  namespace: {{ include "sk8l.namespace" . }}
  labels:
    {{- if .Values.serviceAccount.metadata.labels }}
    {{- toYaml .Values.serviceAccount.metadata.labels | nindent 4 }}
    {{- else }}
    name: sk8l
    {{- end }}
  {{- with .Values.serviceAccount.metadata.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
