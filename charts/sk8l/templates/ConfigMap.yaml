{{- $httpPort := 8590 }}
{{- if and .Values.service .Values.service.ports (gt (len .Values.service.ports) 0) }}
{{- $httpPort = (index .Values.service.ports 0).port | default 8590 }}
{{- end }}
{{- $tlsEnabled := false }}
{{- if .Values.tls }}
{{- $tlsEnabled = .Values.tls.enabled | default false }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sk8l-api-configmap
  namespace: {{ include "sk8l.namespace" . }}
data:
  SK8L_HTTP_PORT: {{ $httpPort | quote }}
  TLS_ENABLED: {{ ternary "true" "false" $tlsEnabled | quote }}
  {{- if .Values.rbac.clusterWide }}
  K8_NAMESPACE: {{ .Values.sk8lApi.targetNamespace | default "" | quote }}
  {{- else }}
  K8_NAMESPACE: {{ default (include "sk8l.namespace" .) .Values.sk8lApi.targetNamespace | quote }}
  {{- end }}
  {{- with .Values.sk8lApi.corsAllowedOrigins }}
  SK8L_CORS_ALLOWED_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  {{- if .Values.sk8lApi.logLevel }}
  LOG_LEVEL: {{ .Values.sk8lApi.logLevel | quote }}
  {{- end }}
  {{- if .Values.sk8lApi.apiURL }}
  VITE_SK8L_API_URL: {{ .Values.sk8lApi.apiURL | quote }}
  {{- end }}
