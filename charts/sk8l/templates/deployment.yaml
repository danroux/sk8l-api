{{- $httpPort := 8590 }}
{{- if and .Values.service .Values.service.ports (gt (len .Values.service.ports) 0) }}
{{- $httpPort = (index .Values.service.ports 0).port | default 8590 }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk8l-api
  labels:
    app: sk8l
  namespace: {{ include "sk8l.namespace" . | quote }}
spec:
  {{- if .Values.sk8lApi.autoscaling.enabled }}
  replicas: {{ .Values.sk8lApi.autoscaling.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/pod: sk8l-api
  {{- with .Values.updateStrategy }}
  strategy:
    {{ toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/pod: sk8l-api
        app.kubernetes.io/name: sk8l
      annotations:
        sk8l.io/api-scrape-port: {{ $httpPort | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/ConfigMap.yaml") . | sha256sum }}
    spec:
      hostname: sk8l-api
      subdomain: sk8l
      automountServiceAccountToken: true
      serviceAccountName: {{ include "sk8l.serviceAccountName" . }}
      {{- template "securityContext.pod" . }}
      containers:
        - name: sk8l-api
          {{- template "securityContext.container" . }}
          {{- $apiImage := .Values.sk8lApi.image | default "danroux/sk8l-api" }}
          {{- $apiTag := .Values.sk8lApi.imageTag | default "v0.24.0" }}
          image: {{ printf "%s:%s" $apiImage $apiTag }}
          imagePullPolicy: {{ .Values.sk8lApi.imagePullPolicy | default "IfNotPresent" | quote }}
          ports:
            - name: http
              protocol: TCP
              containerPort: {{ $httpPort }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 10 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: sk8l-api-configmap
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/sk8l-certs
              readOnly: true
            {{- if .Values.sk8lApi.volumeMounts }}
            {{- toYaml .Values.sk8lApi.volumeMounts | nindent 12 }}
            {{- end }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tls-certs
          projected:
            sources:
            - secret:
                name: sk8l-server-cert-secret
                items:
                  - key: tls.crt
                    path: server-cert.pem
                  - key: tls.key
                    path: server-key.pem
            - secret:
                name: sk8l-ca-root-cert-secret
                items:
                  - key: tls.crt
                    path: ca-cert.pem
        {{- if .Values.sk8lApi.volumes }}
        {{- toYaml .Values.sk8lApi.volumes | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
