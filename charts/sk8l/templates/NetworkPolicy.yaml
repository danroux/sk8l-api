{{- if eq (.Values.networkPolicy.enabled | toString) "true" }}
{{- $httpPort := 8590 }}
{{- if and .Values.service .Values.service.ports (gt (len .Values.service.ports) 0) }}
{{- $httpPort = (index .Values.service.ports 0).port | default 8590 }}
{{- end }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ include "sk8l.namespace" . }}
  name: sk8l-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/pod: sk8l-api
  ingress: []
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ include "sk8l.namespace" . }}
  name: sk8l-egress-allow-internal-only
spec:
  policyTypes:
  - Egress
  podSelector: {}
  egress:
  - to:
    - namespaceSelector: {}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ include "sk8l.namespace" . }}
  name: sk8l-api-allow-apiserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/pod: sk8l-api
  {{- toYaml .Values.networkPolicy.apiserverPolicy | nindent 2 }}
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ include "sk8l.namespace" . }}
  name: sk8l-allow-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/pod: sk8l-api
  policyTypes:
    - Ingress
  ingress:
    - {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ $httpPort }}
{{- end }}
