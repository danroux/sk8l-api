# Available parameters and their default values for the sk8l Chart.

namespace:
  create: false
  # name overrides .Release.Namespace when set. Defaults to .Release.Namespace if unset.
  name: ""
  labels: {}
  # pod-security.kubernetes.io/enforce: baseline
  # pod-security.kubernetes.io/enforce-version: latest
  # pod-security.kubernetes.io/warn: restricted
  # pod-security.kubernetes.io/warn-version: latest
rbac:
  # Specifies whether RBAC resources (Role/ClusterRole and RoleBinding/ClusterRoleBinding) should be created
  create: true
  # clusterWide: if true, creates ClusterRole and ClusterRoleBinding (cluster-scoped access).
  # If false (default), creates namespaced Role and RoleBinding scoped strictly to the release namespace.
  clusterWide: false
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  metadata:
    name: "sk8l"
    labels:
      name: "sk8l"
    # Annotations to add to the service account
    annotations: {}
sk8lApi:
  image: "danroux/sk8l-api"
  imageTag: "v0.25.0"
  imagePullPolicy: ""
  # targetNamespace: Namespace to monitor jobs/cronjobs in.
  # When rbac.clusterWide is false, defaults to the release namespace.
  # When rbac.clusterWide is true, defaults to "" (watches all namespaces across the cluster).
  targetNamespace: ""
  # apiURL: Optional override for the embedded UI API base URL (VITE_SK8L_API_URL).
  # Defaults to "" (same-origin requests to the unified sk8l-api HTTP server).
  apiURL: ""
  # corsAllowedOrigins: Exact origins (scheme://host[:port]) allowed to call the API cross-origin.
  # Defaults to [] (CORS disabled): the embedded UI is served same-origin and needs no CORS.
  # Only set this when a UI runs on another origin, e.g. a local Vite dev server
  # ("http://localhost:5173"). Wildcards are rejected: the API has no authentication, so any web
  # page the user visits could otherwise read workload data.
  corsAllowedOrigins: []
  # logLevel controls the verbosity of the sk8l-api logger.
  # Valid values: trace, debug, info, warn, warning, error, disabled, off.
  # Defaults to info when unset.
  logLevel: ""
  autoscaling:
    enabled: true
    replicaCount: 1
  volumeMounts: []
  volumes: []
tls:
  # enabled: When false (default), sk8l-api serves HTTP/1.1 and unencrypted HTTP/2 (h2c) on port 8590
  # without requiring TLS certificates or cert-manager. Set to true to enable end-to-end HTTPS/TLS.
  enabled: false
  # secretName: Kubernetes TLS Secret containing tls.crt and tls.key when tls.enabled is true.
  secretName: "sk8l-server-cert-secret"
  # Client certificates (mTLS) are not requested or verified. Authenticate/authorize callers at an
  # Ingress, Gateway API, or service mesh in front of sk8l.
# Security context for the pod template and containers
securityContext:
  pod:
    runAsNonRoot: true
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: ['ALL']
    seccompProfile:
      type: RuntimeDefault
service:
  annotations: []
  # type: ClusterIP by default (no built-in auth); use port-forward or an authenticating Ingress/Gateway.
  type: ClusterIP
  labels:
    app.kubernetes.io/name: sk8l
  ports:
    - name: http
      protocol: TCP
      port: 8590
      targetPort: http
# Enables network policy for sk8l pods
networkPolicy:
  enabled: true
  # ingressFrom restricts sources allowed to reach the unified HTTP port (8590).
  # When empty, TCP 8590 is open to any in-cluster source (e.g. Ingress controllers and Prometheus).
  ingressFrom: []
  apiserverPolicy:
    ingress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/8
    egress:
      - to:
          - ipBlock:
              cidr: 0.0.0.0/8
# Grafana dashboard auto-provisioning
grafanaDashboard:
  # When enabled, creates a ConfigMap containing the official sk8l overview dashboard
  # labeled for automatic discovery by Grafana sidecars (e.g. kube-prometheus-stack).
  enabled: true
  # Target namespace for the dashboard ConfigMap. Defaults to the chart release namespace.
  namespace: ""
  # Labels to apply to the dashboard ConfigMap.
  # The 'grafana_dashboard: "1"' label is used by Grafana sidecar to import dashboards.
  labels:
    grafana_dashboard: "1"
  # Folder name in Grafana to organize the dashboard under.
  folder: "sk8l"
  # Additional annotations for the ConfigMap.
  annotations: {}
resources: {}
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
updateStrategy: {}
